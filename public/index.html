<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5"/>
  <meta name="theme-color" content="#3d0d1a"/>
  <meta name="description" content="Agash & Deepika Wedding · July 2, 2026 · Banjara Banquets, Cumming GA"/>
  <meta property="og:title" content="Agash & Deepika Wedding"/>
  <title>Agash & Deepika · July 2, 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=Great+Vibes&family=Italiana&family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }
    body { margin: 0; font-family: 'Cormorant Garamond', serif; background: #1a0a14; color: #fef5dc; overflow-x: hidden; }
    html { scroll-behavior: smooth; }
    
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
    @keyframes sparkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes shimmerText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes goldGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(245,208,103,0.3), 0 0 40px rgba(245,208,103,0.15); }
      50% { box-shadow: 0 0 30px rgba(245,208,103,0.5), 0 0 60px rgba(245,208,103,0.25); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
    
    button:active { transform: scale(0.98); }
    *::selection { background: rgba(245,208,103,0.4); color: #fef5dc; }
    
    .gold-text {
      background: linear-gradient(90deg, #c89a3e, #f5d067, #fce394, #f5d067, #c89a3e);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmerText 4s ease-in-out infinite;
    }
    
    .sparkle {
      animation: sparkle 2s ease-in-out infinite;
    }
  </style>
</head>
<body><div id="root"></div></body>
</html>
